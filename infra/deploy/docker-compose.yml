      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on: *db-depends
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4005/health/live > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nicu:
    <<: *app
    image: ${UHS_IMAGE_PREFIX}/uhs-nicu:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      SERVICE_NAME: nicu
      PORT: '4006'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://uhs_app:${POSTGRES_APP_PASSWORD}@postgres:5432/uhs_nicu
      MIGRATION_DATABASE_URL: postgresql://uhs_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/uhs_nicu
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      AUTH_JWKS_URL: http://auth:4001/api/auth/jwks
