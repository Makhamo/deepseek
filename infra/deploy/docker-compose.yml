  claims:
    <<: *app
    image: ${UHS_IMAGE_PREFIX}/uhs-claims:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      SERVICE_NAME: claims
      PORT: '4008'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://uhs_app:${POSTGRES_APP_PASSWORD}@postgres:5432/uhs_claims
