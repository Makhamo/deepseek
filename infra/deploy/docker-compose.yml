  web:
    <<: *app
    image: ${UHS_IMAGE_PREFIX}/uhs-web:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      PORT: '3000'
      AUTH_SERVICE_URL: http://auth:4001
      CORE_SERVICE_URL: http://core:4002
      DOCTOR_SERVICE_URL: http://doctor:4003
      TRIAGE_SERVICE_URL: http://triage:4004
      LAB_SERVICE_URL: http://lab:4005
      NICU_SERVICE_URL: http://nicu:4006
      PHARMACY_SERVICE_URL: http://pharmacy:4007
      CLAIMS_SERVICE_URL: http://claims:4008
      NOTIFICATIONS_SERVICE_URL: http://notifications:4009
    ports:
      - '${WEB_HOST_PORT}:3000'
    depends_on:
      auth:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  internal:
