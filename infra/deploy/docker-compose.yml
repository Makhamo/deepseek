  pharmacy:
    <<: *app
    image: ${UHS_IMAGE_PREFIX}/uhs-pharmacy:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      SERVICE_NAME: pharmacy
      PORT: '4007'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://uhs_app:${POSTGRES_APP_PASSWORD}@postgres:5432/uhs_pharmacy
      MIGRATION_DATABASE_URL: postgresql://uhs_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/uhs_pharmacy
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
